<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TK Study - Ôn Tập Hệ Thống Tài Khoản Kế Toán (Thông Tư 99/2025/TT-BTC)</title>
  
  <!-- Apple Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace']
          },
          colors: {
            apple: {
              blue: '#0071e3',
              green: '#34c759',
              orange: '#ff9500',
              red: '#ff3b30',
              purple: '#af52de',
              indigo: '#5856d6',
              teal: '#30b0c7'
            }
          }
        }
      }
    };
  </script>

  <!-- Apple Theme Custom Stylesheet -->
  <link rel="stylesheet" href="/src/styles/apple-theme.css">

  <style>
    /* Prevent iOS rubberband effect and overflow issues */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #f5f5f7;
    }
    html.dark, html.dark body {
      background-color: #000000;
    }
    /* Simple fade-in utility */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] dark:bg-black text-neutral-900 dark:text-neutral-100 antialiased selection:bg-blue-500/20">
  <div id="root">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30 animate-pulse">
        TK
      </div>
      <div class="text-sm font-semibold text-neutral-600 dark:text-neutral-400">
        Đang khởi tạo TK Study...
      </div>
    </div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
